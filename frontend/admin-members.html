<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Requests - Leo Club Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-nav.navbar { background: #fafafa !important; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .admin-nav .navbar-brand { color: #333 !important; }
        .admin-nav .nav-link { color: #333 !important; margin-left: 0.5rem; padding: 0.5rem 0.75rem !important; border-radius: 6px; font-weight: 500; transition: all 0.3s ease; }
        .admin-nav .nav-link:hover { color: #333 !important; background-color: rgba(0,0,0,0.05) !important; text-decoration: underline; transform: translateY(-2px); }
        .admin-nav .nav-link.active { color: var(--bs-primary) !important; background-color: rgba(13, 110, 253, 0.1) !important; font-weight: 600; text-decoration: none; }
        .page-title { font-weight: 700; text-align: center; margin-bottom: 1.5rem; }
        .badge-pending { background: #ffc107; color: #000; }
        .pagination .page-link { margin: 0 2px; }
        .admin-footer { margin-top: auto; background-color: #000; padding: 16px 20px; text-align: center; color: #fff; font-size: 0.875rem; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-light admin-nav">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin">
                <img src="/images/logo.png" alt="Logo" height="40" class="d-inline-block align-top me-2">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/members">Members</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/contacts">Contacts</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/newsletter">Newsletter</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutLink">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 py-4">
        <h1 class="page-title">Membership Requests</h1>
        <div id="membersLoading" class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2">Loading...</p>
        </div>
        <div id="membersContent" class="d-none">
            <div class="table-responsive border rounded">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="membersTableBody"></tbody>
                </table>
            </div>
            <div id="membersEmpty" class="text-center py-5 text-muted d-none">No membership requests yet.</div>
            <nav class="mt-3 d-flex justify-content-center" id="paginationNav"></nav>
        </div>
    </main>

    <!-- View modal -->
    <div class="modal fade" id="viewMemberModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Membership Request Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewMemberBody"></div>
            </div>
        </div>
    </div>

    <footer class="admin-footer">&copy; 2025 Leo Club of Kathmandu Alka - All rights reserved</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-common.js"></script>
    <script src="/js/admin-members.js"></script>
</body>
</html>
